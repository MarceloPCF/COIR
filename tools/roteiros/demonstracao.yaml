# Roteiro de demonstração: um ano (2025) de um investidor fictício, para o banco das capturas de
# tela e do manual. Tudo é inventado (titular, conta, preços); os tickers e as datas de pregão são
# reais para o COIR reconhecer os ativos e o calendário.
#
# Negócio Bovespa: "C|V [MERCADO] ESPECIFICAÇÃO QUANTIDADE PREÇO [D]". MERCADO: VISTA (padrão),
# CALL, PUT, EXERC_CALL, EXERC_PUT; D no fim marca day trade. Ação e FII pelo ticker (a nota imprime
# o nome de pregão); opção pela série seguida da classe do objeto ("PETRC380 PN"; exercício com o
# sufixo E). Negócio BM&F (segmento: bmf): "C|V CONTRATO QUANTIDADE PREÇO", sempre day trade; o
# preço de ajuste do dia é o do último negócio da nota. Preços sempre com vírgula ("36,20").
#
# O que o ano mostra: compras à vista, venda isenta (abaixo de R$ 20 mil), venda coberta de CALL
# com exercício (venda tributável), day trade de ações e de mini-índice, PUT que vira pó, prejuízo
# compensado meses depois, FII com lucro (20%) e rendimentos, dividendos e JCP, DARF a pagar.

titular: Titular de Demonstração
corretora: XP
conta: "1234567"
primeira_nota: 41001

# Custos impressos nas notas (proporção do volume, ao centavo) e a retenção na fonte (0,005% das
# vendas comuns; 1% do resultado positivo do day trade; até R$ 1,00 a retenção é dispensada).
custos:
  liquidacao: "0.00025"
  emolumentos: "0.00005"
  corretagem: "0.00"
  bmf_registro_por_contrato: "0.10"
  bmf_emolumentos_por_contrato: "0.25"
irrf:
  comum: "0.00005"
  day_trade: "0.01"
  minimo: "1.00"

