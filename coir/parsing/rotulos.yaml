# Rótulos que o COIR procura nas notas de corretagem SINACOR e as formas aceitas de cada um.
# Lido por coir/parsing/rotulos.py. A primeira forma de cada lista é a de referência, usada nas
# mensagens de erro.
#
# Valem em todas as formas, sem precisar escrever:
#   - acento e maiúsculas: "pregão" = "PREGAO" = "Pregao";
#   - espaço entre palavras opcional ou repetido: "Data pregão" = "Datapregão" = "Data   pregão";
#     espaço solto dentro da palavra também ("Taxa de liq uidação"), como algumas notas imprimem;
#   - quebra de linha entre as palavras, quando o rótulo não está inteiro em nenhuma linha;
#   - o rótulo não começa no meio de uma palavra: "Bolsa" não casa "Rebolsa".
#
# Sintaxe:
#   [de|do|da]   palavra opcional: uma das alternativas ou nenhuma
#   Taxa|Tx.     uma das alternativas
#   Nr.          abreviação: o ponto é opcional, mas sem o ponto a palavra não pode continuar
#                ("Fl." casa "Fl 1" e "Fl.1", não "Flex"); de uma letra só ("D."), o ponto é
#                obrigatório: "D" solto pode ser o D/C de um valor
#   A.N.A.       ponto no meio da palavra: opcional ("ANA")
#   Nº           º e ° valem um pelo outro
#   opera*       começo de palavra: o resto vai até o próximo espaço (acentos ilegíveis no PDF)
#
# Cuidado ao acrescentar uma forma: ela não pode casar com outro campo da nota. Os testes negativos
# de tests/unit/parsing/test_rotulos.py conferem os casos conhecidos. Ficaram de fora de propósito:
#   - "Data" sozinha (casaria "Data liquidação") e "Pregão" sozinho;
#   - "Emol." (casaria "Taxas BM&F (emol+f.gar)": emolumentos e taxas BM&F nunca entram os dois);
#   - "Página"/"Pág." como folha (o rodapé "Página 1 de 2" não é o número da folha);
#   - "N." como número da nota (letra solta demais, mesmo com o ponto);
#   - "Taxa" ou "Valor" sozinhos, e "Oper." em "Valor das operações" (é o começo do rótulo dos
#     títulos públicos).

