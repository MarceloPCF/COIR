name: Release (rascunho)

# Tag vX.Y.Z (ou execução manual): varredura de dados pessoais, testes, pacote para Windows com o
# teste de fumaça (executáveis rodando com o PATH sem Python) e um release RASCUNHO com o zip e o
# .sha256. O mantenedor revisa as notas e publica à mão.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  pacote:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Varredura de dados pessoais
        shell: bash
        run: |
          git ls-files -z > arquivos.lst
          xargs -0 -a arquivos.lst uv run --no-project python tools/verificar_dados_pessoais.py --minimo 1

      - name: Instalar dependências
        run: uv sync --locked

      - name: Testes
        run: uv run pytest -q -m "not golden"

      - name: Versão da tag = versão do programa
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          esperada="${GITHUB_REF_NAME#v}"
          atual="$(uv run python -c 'import coir; print(coir.__version__)')"
          test "$esperada" = "$atual" || { echo "tag $GITHUB_REF_NAME x versão $atual"; exit 1; }

      # o teste de fumaça do empacotar roda os .exe com um PATH sem Python
      - name: Pacote e teste de fumaça
        run: uv run python -m tools.empacotar --saida dist

      - name: Release rascunho
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          versao="$(uv run python -c 'import coir; print(coir.__version__)')"
          gh release create "v$versao" dist/COIR-*-windows.zip dist/COIR-*-windows.zip.sha256 \
            --draft --title "COIR $versao" \
            --notes "Rascunho criado pelo workflow. Antes de publicar, cole aqui a seção $versao do CHANGELOG."
