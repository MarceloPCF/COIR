name: Referências públicas (coleta semanal)

# Coleta as fontes públicas (Cadastro de Instrumentos e eventos das companhias da B3, Selic do
# BCB), regrava as tabelas geradas de data/ e, se algo mudou, abre um PR contra a main com o resumo.
# O mantenedor revisa; o merge publica o pacote (publicar-referencias.yml).
# Pré-requisito: Settings > Actions > General > "Allow GitHub Actions to create and approve pull
# requests".
#
# Roda em todo dia útil, mas coleta uma vez por semana: o primeiro dia com pregão da semana faz a
# coleta, e os seguintes só agem se ela ainda não deu certo. Falhou: abre uma issue (o GitHub avisa
# por e-mail), e o dia seguinte tenta de novo. Deu certo: a issue é fechada.

on:
  schedule:
    - cron: "0 9 * * 1-5"  # dias úteis, 06:00 de Brasília
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: referencias
  cancel-in-progress: false

env:
  PYTHONUTF8: "1"

jobs:
  decidir:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      coletar: ${{ steps.decisao.outputs.coletar }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"

      - name: Precisa coletar hoje?
        id: decisao
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENTO: ${{ github.event_name }}
        run: |
          if [ "$EVENTO" = "workflow_dispatch" ]; then
            echo "Pedido à mão: coleta."
            echo "coletar=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          situacao=0
          uv run --no-project --python 3.13 python -m tools.referencias pregao || situacao=$?
          if [ "$situacao" = "10" ]; then
            echo "Dia sem pregão: fica para o próximo dia útil."
            echo "coletar=false" >> "$GITHUB_OUTPUT"
            exit 0
          elif [ "$situacao" != "0" ]; then
            echo "Erro ao consultar o calendário (código $situacao)."
            exit "$situacao"
          fi
          segunda=$(date -u -d "$(date -u +%F) -$(( $(date -u +%u) - 1 )) days" +%F)
          for run in $(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/referencias.yml/runs?created=%3E%3D$segunda&per_page=20" --jq '.workflow_runs[].id'); do
            feita=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$run/jobs" --jq '[.jobs[] | select(.name == "coletar" and .conclusion == "success")] | length')
            if [ "$feita" != "0" ]; then
              echo "A coleta desta semana já deu certo (execução $run)."
              echo "coletar=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "coletar=true" >> "$GITHUB_OUTPUT"

  coletar:
    needs: decidir
    if: needs.decidir.outputs.coletar == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: main

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          version: "0.12.23"

      # o coletor só usa a biblioteca padrão: não instala o COIR
      - name: Coletar e gerar
        run: uv run --no-project --python 3.13 python -m tools.referencias atualizar --resumo "$RUNNER_TEMP/resumo.md"

      # PR aberto pelo GITHUB_TOKEN não dispara o CI: os testes rodam aqui, antes do PR
      - name: Instalar dependências
        run: uv sync --locked

      - name: Testes com as tabelas novas
        run: |
          uv run ruff check .
          uv run pyright
          uv run pytest -q -m "not golden"

      - name: Varredura de dados pessoais
        shell: bash
        run: |
          git add -N data  # arquivos novos de data/ entram na varredura
          git ls-files -z > "$RUNNER_TEMP/arquivos.lst"
          xargs -0 -a "$RUNNER_TEMP/arquivos.lst" uv run --no-project --python 3.13 python tools/verificar_dados_pessoais.py --minimo 1

      - name: Abrir PR
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data; then
            echo "Nenhuma mudança nas tabelas."
            exit 0
          fi
          dia=$(date -u +%Y-%m-%d)
          ramo="referencias/$dia"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$ramo"
          git add data
          git commit -m "chore(referencias): coleta de $dia"
          git push -u origin "$ramo"
          gh pr create --base main --head "$ramo" \
            --title "Referências públicas: coleta de $dia" \
            --body-file "$RUNNER_TEMP/resumo.md"

  alarme:
    needs: [decidir, coletar]
    # avisa também se a própria decisão quebrou: senão a coleta para sem ninguém saber
    if: always() && (needs.decidir.result == 'failure' || needs.decidir.outputs.coletar == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Abrir ou fechar a issue da coleta
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RESULTADO: ${{ needs.decidir.result == 'failure' && 'failure' || needs.coletar.result }}
          EXECUCAO: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          titulo="Coleta de referências públicas falhou"
          aberta=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$titulo\" in:title" --json number --jq '.[0].number // empty')
          if [ "$RESULTADO" = "success" ]; then
            if [ -n "$aberta" ]; then
              gh issue close "$aberta" --repo "$GITHUB_REPOSITORY" --comment "A coleta voltou a funcionar: $EXECUCAO"
            fi
            exit 0
          fi
          texto="Resultado: $RESULTADO em $(date -u +%F). Veja o log: $EXECUCAO. O próximo dia útil tenta de novo; sem a coleta, as tabelas do COIR ficam paradas."
          if [ -n "$aberta" ]; then
            gh issue comment "$aberta" --repo "$GITHUB_REPOSITORY" --body "$texto"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$titulo" --body "$texto"
          fi
