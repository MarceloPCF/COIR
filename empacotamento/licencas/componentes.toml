# Componentes de terceiros do pacote do COIR que não são pacotes Python com licença nos metadados
# (os pacotes Python o tools/empacotar.py lê dos próprios metadados). Cada componente traz os
# arquivos do pacote que cobre (`caminhos`, glob a partir da pasta COIR/ do zip) e o texto oficial
# da licença (`arquivos`, nesta pasta; "@python" e "@pyinstaller" vêm do ambiente que monta o
# pacote). Ao montar, o empacotar falha se um componente não achar nenhum arquivo (lista velha) ou
# se um arquivo de terceiro do pacote não estiver coberto (componente novo do NiceGUI, por exemplo).
# Atualizar versão e texto ao subir o NiceGUI, o pywebview ou o Python: a montagem falha se as
# versões instaladas forem outras que as de [conferido].
#
# Limite: componentes que dividem uma pasta (os cinco do ECharts em echart/dist, Material e Roboto em
# static/fonts) não acusam biblioteca nova dentro dela; a trava de versão em [conferido] é que pede a
# revisão ao subir o NiceGUI.

# Arquivos de terceiros que são do próprio pacote Python (licença nos metadados dele), dentro das
# pastas que a verificação olha arquivo por arquivo.
proprios = [
    "_internal/nicegui/static/nicegui.js",
    "_internal/nicegui/static/nicegui.css",
    "_internal/nicegui/static/headwind.css",
    "_internal/nicegui/static/fonts.css",
    "_internal/nicegui/static/favicon.ico",
    "_internal/nicegui/static/sad_face.svg",
    "_internal/nicegui/static/utils/*",
    "_internal/webview/lib/WebBrowserInterop.*.dll",
    "_internal/webview/lib/pywebview-android.jar",
]

# Pastas em que todo arquivo tem de estar em `proprios` ou num componente abaixo.
vigiadas = [
    "_internal/nicegui/static/**",
    "_internal/nicegui/elements/*/dist/**",
    "_internal/nicegui/elements/*/lib/**",
    "_internal/webview/lib/**",
]

# Pacotes que nunca podem ir no .zip, além dos grupos de dependência do pyproject (dev, videos):
# ferramentas de montar e testar e o que elas puxam.
proibidos = [
    "pyinstaller", "pyinstaller-hooks-contrib", "pefile", "altgraph", "setuptools",
    "pytest", "pluggy", "iniconfig", "hypothesis",
]

# Pacote Python cujos metadados não trazem o texto da licença: texto oficial do repositório dele.
# proxy_tools: o PyPI declara MIT, mas o LICENSE.txt do repositório
# (https://github.com/jtushman/proxy_tools/blob/master/LICENSE.txt) é BSD; vai o texto do repositório.
[pacotes_sem_texto]
proxy-tools = "proxy-tools.txt"

# Versões para as quais esta lista foi conferida arquivo por arquivo (11/11/2026).
[conferido]
python = "3.13"
nicegui = "3.18.0"
pywebview = "6.2.1"

[[componente]]
nome = "Python"
versao = "3.13"
licenca = "PSF-2.0 (e as licenças das bibliotecas incorporadas, abaixo)"
fonte = "https://www.python.org/ e https://github.com/python/cpython/blob/v3.13.16/Doc/license.rst"
arquivos = ["@python", "python-incorporado.txt", "outros-python.txt"]
# "@dlls-do-python": cada arquivo da pasta DLLs do Python que monta o pacote (_ssl.pyd,
# libcrypto, sqlite3.dll...), pelo nome exato; extensão de terceiro no topo não cai aqui.
caminhos = ["_internal/python3.dll", "_internal/python313.dll", "_internal/base_library.zip", "@dlls-do-python"]

[[componente]]
nome = "Microsoft Visual C++ Runtime e Universal CRT"
versao = "14"
licenca = "Microsoft Distributable Code"
fonte = "https://learn.microsoft.com/cpp/windows/redistributing-visual-cpp-files"
arquivos = ["microsoft-vcredist.txt"]
# api-ms-win-crt-*.dll e ucrtbase.dll só entram se o PyInstaller os coletar (Windows sem UCRT)
caminhos = [
    "_internal/VCRUNTIME140.dll", "_internal/VCRUNTIME140_1.dll",
    "_internal/rapidfuzz.libs/msvcp140-*.dll", "_internal/api-ms-win-*.dll", "_internal/ucrtbase.dll",
]

[[componente]]
